services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    image: mariadb
    env_file: .env
    volumes:
      - db:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    image: wordpress
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: unless-stopped
    depends_on:
      - mariadb
    secrets:
      - db_password
      - credentials

  nginx:
    build: requirements/nginx
    container_name: nginx
    image: nginx
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
    restart: unless-stopped
    depends_on:
      - wordpress

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/magillie/data/db
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/magillie/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
